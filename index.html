  <script>
    /* â”€â”€ Canvas particle system â”€â”€ */
    (function () {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const W = () => canvas.width;
      const H = () => canvas.height;

      /* --- Bokeh orbs --- */
      const BOKEH_COLORS = [
        'hsl(38,90%,65%)', 'hsl(320,60%,60%)', 'hsl(260,70%,70%)',
        'hsl(200,80%,70%)', 'hsl(50,85%,62%)', 'hsl(0,70%,65%)'
      ];
      const bokeh = Array.from({ length: 28 }, () => ({
        x: Math.random(), y: Math.random(),
        r: 28 + Math.random() * 90,
        a: 0.08 + Math.random() * 0.14,
        dx: (Math.random() - 0.5) * 0.00015,
        dy: -0.00008 - Math.random() * 0.00012,
        color: BOKEH_COLORS[Math.floor(Math.random() * BOKEH_COLORS.length)]
      }));

      /* --- Sparkle dots --- */
      const sparkles = Array.from({ length: 90 }, () => ({
        x: Math.random(), y: Math.random(),
        r: 0.5 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2.5
      }));

      /* --- Falling petals --- */
      const PETAL_COLORS = ['#f7d48f','#f5b8c8','#e8c0e0','#fde8b0','#c8c0f5','#f0e0a0','#ffd0a0'];
      const petals = Array.from({ length: 50 }, () => ({
        x: Math.random(), y: Math.random(),
        w: 4 + Math.random() * 10, h: 2 + Math.random() * 5,
        a: 0.32 + Math.random() * 0.52,
        dy: 0.0002 + Math.random() * 0.0006,
        dx: (Math.random() - 0.5) * 0.0004,
        rot: Math.random() * Math.PI * 2,
        drot: (Math.random() - 0.5) * 0.04,
        color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)]
      }));

      /* --- Disco ball sweep blobs (rotate around ballroom center) --- */
      const DISCO = [
        [255,190,80],[190,110,255],[70,200,255],
        [255,100,160],[255,220,80],[110,255,180],
        [255,150,100],[160,100,255],[80,220,200],
        [255,80,120],[220,200,80],[100,180,255]
      ];
      const discoBlobs = Array.from({ length: 12 }, (_, i) => ({
        angle: (Math.PI * 2 * i) / 12 + Math.random() * 0.4,
        radius: 0.20 + Math.random() * 0.20,
        size: 38 + Math.random() * 65,
        alpha: 0.14 + Math.random() * 0.16,
        speed: (0.15 + Math.random() * 0.28) * (Math.random() > 0.5 ? 1 : -1),
        color: DISCO[i % DISCO.length],
        yBias: 0.32 + Math.random() * 0.32
      }));

      /* --- Shooting stars --- */
      const shootingStars = [];
      let nextStarAt = performance.now() + 1200 + Math.random() * 2500;
      const STAR_COLORS = [
        'rgba(255,242,185,', 'rgba(255,205,145,',
        'rgba(210,185,255,', 'rgba(145,225,255,'
      ];

      function spawnStar() {
        shootingStars.push({
          x: Math.random() * 0.85,
          y: Math.random() * 0.42,
          len: 80 + Math.random() * 170,
          speed: 0.004 + Math.random() * 0.006,
          angle: Math.PI / 4 + (Math.random() - 0.5) * 0.45,
          progress: 0,
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)]
        });
        nextStarAt = performance.now() + 2200 + Math.random() * 6000;
      }

      /* --- Candle flicker glows at table positions --- */
      const CANDLES = [0.072, 0.27, 0.50, 0.73, 0.928].map(xRatio => ({
        x: xRatio,
        y: 0.81,
        phase: Math.random() * Math.PI * 2,
        r: 16 + Math.random() * 16
      }));

      /* --- Camera flash --- */
      let flashAlpha = 0;
      function triggerFlash() {
        flashAlpha = 0.32;
        setTimeout(() => { flashAlpha = 0; }, 110);
      }
      (function scheduleFlash() {
        setTimeout(() => { triggerFlash(); scheduleFlash(); }, 9000 + Math.random() * 14000);
      }());

      /* --- Pulse rings on object-wrap --- */
      const objectWrap = document.querySelector('.object-wrap');
      function spawnPulseRing() {
        if (!objectWrap) return;
        const ring = document.createElement('div');
        ring.className = 'pulse-ring';
        objectWrap.appendChild(ring);
        ring.addEventListener('animationend', () => ring.remove(), { once: true });
      }
      setInterval(spawnPulseRing, 2800);

      /* --- TICK --- */
      function tick() {
        const w = W(), h = H();
        ctx.clearRect(0, 0, w, h);
        const t = performance.now() / 1000;

        /* Bokeh */
        bokeh.forEach(b => {
          const bx = b.x * w, by = b.y * h;
          const g = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
          g.addColorStop(0, b.color.replace('hsl', 'hsla').replace(')', `,${b.a})`));
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath(); ctx.fillStyle = g;
          ctx.arc(bx, by, b.r, 0, Math.PI * 2); ctx.fill();
          b.x += b.dx; b.y += b.dy;
          if (b.y < -b.r / h) { b.y = 1 + b.r / h; b.x = Math.random(); }
          if (b.x < -b.r / w) b.x = 1 + b.r / w;
          if (b.x > 1 + b.r / w) b.x = -b.r / w;
        });

        /* Disco sweep blobs */
        discoBlobs.forEach(d => {
          d.angle += d.speed * 0.016;
          const cx = 0.5 + Math.cos(d.angle) * d.radius;
          const cy = d.yBias + Math.sin(d.angle) * d.radius * 0.42;
          const [r, g2, b2] = d.color;
          const gr = ctx.createRadialGradient(cx * w, cy * h, 0, cx * w, cy * h, d.size);
          gr.addColorStop(0, `rgba(${r},${g2},${b2},${d.alpha})`);
          gr.addColorStop(1, `rgba(${r},${g2},${b2},0)`);
          ctx.beginPath(); ctx.fillStyle = gr;
          ctx.arc(cx * w, cy * h, d.size, 0, Math.PI * 2); ctx.fill();
        });

        /* Sparkles */
        sparkles.forEach(s => {
          const alpha = ((Math.sin(t * s.speed + s.phase) + 1) / 2) * 0.95;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.shadowColor = '#ffe090'; ctx.shadowBlur = 6;
          ctx.fillStyle = '#fff8e0';
          ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });

        /* Petals */
        petals.forEach(p => {
          ctx.save();
          ctx.globalAlpha = p.a;
          ctx.translate(p.x * w, p.y * h);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.ellipse(0, 0, p.w, p.h, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          p.y += p.dy; p.x += p.dx; p.rot += p.drot;
          if (p.y > 1.02) { p.y = -0.02; p.x = Math.random(); }
        });

        /* Shooting stars */
        if (performance.now() > nextStarAt) spawnStar();
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const s = shootingStars[i];
          const tx = s.x * w, ty = s.y * h;
          const hx = tx + Math.cos(s.angle) * s.len * s.progress;
          const hy = ty + Math.sin(s.angle) * s.len * s.progress;
          const fadeA = (1 - s.progress) * 0.88;
          ctx.save(); ctx.globalAlpha = fadeA;
          const grad = ctx.createLinearGradient(tx, ty, hx, hy);
          grad.addColorStop(0,   s.color + '0)');
          grad.addColorStop(0.6, s.color + '0.85)');
          grad.addColorStop(1,   s.color + '0)');
          ctx.strokeStyle = grad; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
          ctx.restore();
          s.progress += s.speed;
          if (s.progress >= 1) shootingStars.splice(i, 1);
        }

        /* Candle flicker glows at table bottom */
        CANDLES.forEach(c => {
          const flicker = 0.65 + 0.35 *
            Math.sin(t * 4.8 + c.phase) * Math.sin(t * 7.1 + c.phase + 1.4);
          const cx = c.x * w, cy = c.y * h;
          const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, c.r * flicker);
          gr.addColorStop(0,   `rgba(255,228,130,${0.38 * flicker})`);
          gr.addColorStop(0.4, `rgba(255,175,70,${0.20 * flicker})`);
          gr.addColorStop(1,   'rgba(255,110,30,0)');
          ctx.beginPath(); ctx.fillStyle = gr;
          ctx.arc(cx, cy, c.r * flicker, 0, Math.PI * 2); ctx.fill();
        });

        /* Camera flash */
        if (flashAlpha > 0) {
          ctx.save();
          ctx.globalAlpha = flashAlpha;
          ctx.fillStyle = 'rgba(255,255,245,1)';
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        requestAnimationFrame(tick);
      }
      tick();
    }());

    const nostalgicLines = [
      '"Can I get another plate of that paneer?" - every uncle at every reception.',
      'The DJ said last song. Nobody believed him. He played four more.',
      'Waiter uncle appeared from nowhere with the exact thing you were craving.',

    ];

      { title: 'Aaja Re More Sajan',                     videoId: VIDEO_ID, start: 7113  },
      { title: 'Dam Bhar Jo Udhar Munh Phere',           videoId: VIDEO_ID, start: 7362  },
      { title: 'Rahen Na Rahen',                         videoId: VIDEO_ID, start: 7568  },
      { title: 'Lo Aa Gayi Unki Yaad',                   videoId: VIDEO_ID, start: 7793  },
      { title: 'O Sajna Barkha Bahar Aayi',              videoId: VIDEO_ID, start: 7997  },
      { title: 'Thandi Hawayein',                        videoId: VIDEO_ID, start: 8244  },
      { title: 'Tumhi Meri Mandir',                      videoId: VIDEO_ID, start: 8425  },
      { title: 'Chal Akela Chal Akela',                  videoId: VIDEO_ID, start: 8662  },
      { title: 'Lakhon Tare Aasman Per',                 videoId: VIDEO_ID, start: 8871  },
      { title: 'Tu Kahe Agar',                           videoId: VIDEO_ID, start: 9067  },
      { title: 'Aansoo Bhari Hai Ye Jeevan Ki',          videoId: VIDEO_ID, start: 9274  },
      { title: 'Gaaye Ja Geet Milan Ke',                 videoId: VIDEO_ID, start: 9492  },
      { title: 'Jhoom Jhoom Ke Nacho Aaj',               videoId: VIDEO_ID, start: 9725  },
      { title: 'Kai Baar Yun Bhi Dekha Hai',             videoId: VIDEO_ID, start: 9906  },
      { title: 'Woh Subah Kabhi To Aayegi',              videoId: VIDEO_ID, start: 10095 },
      { title: 'Zindagi Bhar Nahin Bhoolegi',            videoId: VIDEO_ID, start: 10320 },
      { title: 'Yaad Na Jaye Beete Dinon Ki',            videoId: VIDEO_ID, start: 10483 }
    ];

    /* Pre-compute each track's end time from chronological order */
    const chrono = [...tracks].sort((a, b) => a.start - b.start);
    chrono.forEach((t, i) => { t.end = chrono[i + 1] ? chrono[i + 1].start : null; });

    /* Shuffle tracks on every page load (Fisher-Yates) */
    for (let i = tracks.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
    }

    const trackTitle = document.getElementById('trackTitle');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const cassette = document.getElementById('cassette');
    const sparkLayer = document.getElementById('sparkLayer');

    let trackIndex = 0;
    let player;
    let ticking;
    let isSeeking = false;
    let isPlayerReady = false;
    let pendingPlayRequest = false;

    function formatTime(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds || 0));
      const minutes = Math.floor(sec / 60);
      const seconds = String(sec % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function updateTrackMeta() {
      trackTitle.textContent = tracks[trackIndex].title;
    }

    function setPlayingUI(playing) {
      playBtn.textContent = playing ? '\u23F8' : '\u25B6';
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      cassette.classList.toggle('playing', playing);
    }

    function playCurrentTrack(autoplay = true) {
      if (!player || !tracks[trackIndex]) return;
      const track = tracks[trackIndex];
      updateTrackMeta();

      // All tracks share the same video - seek within it instead of reloading.
      const loaded = player.getVideoData ? player.getVideoData().video_id : null;
      if (loaded === track.videoId) {
        player.seekTo(track.start, true);
        if (autoplay) {
          player.playVideo();
        } else {
          player.pauseVideo();
          setPlayingUI(false);
        }
      } else {
        player.loadVideoById({ videoId: track.videoId, startSeconds: track.start });
        if (!autoplay) {
          player.pauseVideo();
          setPlayingUI(false);
        }
      }
    }

    function requestPlayback(forceLoad = false) {
      if (!player || !isPlayerReady) {
        pendingPlayRequest = true;
        return;
      }

      const state = player.getPlayerState();
      if (forceLoad || state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.CUED) {
        playCurrentTrack(true);
      } else {
        player.playVideo();
      }
    }

    function ensureMusicPlayback() {
      if (!player || !isPlayerReady) {
        pendingPlayRequest = true;
        trackTitle.textContent = 'Initializing player... tap Play again in a second';
        return;
      }

      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        return;
      }

      requestPlayback();
    }

    function triggerDanceDrop() {
      const rect = cassette.getBoundingClientRect();
      const originX = rect.left + rect.width * 0.5;
      const originY = rect.top + rect.height * 0.44;
      const burstCount = 26;

      for (let i = 0; i < burstCount; i += 1) {
        const spark = document.createElement('span');
        spark.className = 'spark';
        spark.style.left = `${originX}px`;
        spark.style.top = `${originY}px`;

        const angle = (Math.PI * 2 * i) / burstCount;
        const spread = 40 + Math.random() * 120;
        spark.style.setProperty('--tx', `${Math.cos(angle) * spread}px`);
        spark.style.setProperty('--ty', `${Math.sin(angle) * spread}px`);
        sparkLayer.appendChild(spark);
        spark.addEventListener('animationend', () => spark.remove(), { once: true });
      }

      // Keep interaction visual-only so it does not compete with music playback.
    }

    function startTicker() {
      clearInterval(ticking);
      ticking = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const current = player.getCurrentTime();
        const total = player.getDuration();

        // Auto-advance using the track's own end time (independent of shuffle order).
        const trackStart = tracks[trackIndex].start;
        const trackEnd = tracks[trackIndex].end || total;

        if (current >= trackEnd - 0.5 && trackIndex < tracks.length - 1) {
          trackIndex++;
          updateTrackMeta();
          playCurrentTrack();
        }

        if (total > 0) {
          const segLen = trackEnd - trackStart;
          const segPos = Math.max(0, current - trackStart);
          const value = segLen > 0 ? (segPos / segLen) * 100 : 0;
          if (!isSeeking) {
            seekBar.value = value;
            seekBar.style.setProperty('--played', `${value}%`);
          }
          currentTimeEl.textContent = formatTime(segPos);
          durationEl.textContent = formatTime(segLen);
        }
      }, 250);
    }

    function onYouTubeIframeAPIReady() {
      const isHttpOrigin = window.location.protocol === 'http:' || window.location.protocol === 'https:';
      const playerVars = {
        playsinline: 1,
        autoplay: 1,
        rel: 0,
        controls: 1,
        modestbranding: 1,
        iv_load_policy: 3
      };

      if (isHttpOrigin) {
        playerVars.origin = window.location.origin;
      }

      player = new YT.Player('yt-frame', {
        height: '1',
        width: '1',
        playerVars,
        events: {
          onReady: () => {
            isPlayerReady = true;
            updateTrackMeta();
            const iframe = player.getIframe();
            if (iframe) {
              iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
            }
            startTicker();
            player.loadVideoById({ videoId: tracks[0].videoId, startSeconds: tracks[0].start });
            setPlayingUI(true);
          },
          onStateChange: (event) => {
            const state = event.data;
            if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
              setPlayingUI(true);
            }
            if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
              setPlayingUI(false);
            }
            if (state === YT.PlayerState.ENDED) {
              // Full video ended - loop back to first track.
              trackIndex = 0;
              playCurrentTrack(true);
            }
          }
        }
      });
    }

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    setTimeout(() => {
      if (!isPlayerReady) {
        trackTitle.textContent = 'Player still loading... tap Play again';
      }
    }, 4500);

    playBtn.addEventListener('click', () => {
      if (!player) {
        pendingPlayRequest = true;
        trackTitle.textContent = 'Loading player...';
        setPlayingUI(true);
        return;
      }
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        setPlayingUI(false);
      } else {
        setPlayingUI(true);
        ensureMusicPlayback();
      }
    });

    prevBtn.addEventListener('click', () => {
      trackIndex = (trackIndex - 1 + tracks.length) % tracks.length;
      setPlayingUI(true);
      requestPlayback(true);
    });

    nextBtn.addEventListener('click', () => {
      trackIndex = (trackIndex + 1) % tracks.length;
      setPlayingUI(true);
      requestPlayback(true);
    });

    seekBar.addEventListener('input', () => {
      isSeeking = true;
      seekBar.style.setProperty('--played', `${seekBar.value}%`);
    });

    seekBar.addEventListener('change', () => {
      if (!player || typeof player.getDuration !== 'function') return;
      // Seek within the current track's segment.
      const trackStart = tracks[trackIndex].start;
      const trackEnd = tracks[trackIndex].end || player.getDuration();
      const segLen = trackEnd - trackStart;
      const target = trackStart + (Number(seekBar.value) / 100) * segLen;
      player.seekTo(target, true);
      isSeeking = false;
    });

    cassette.addEventListener('click', triggerDanceDrop);
    cassette.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'd' || event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        triggerDanceDrop();
        ensureMusicPlayback();
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.repeat) return;
      if (event.key.toLowerCase() === 'd') {
        triggerDanceDrop();
        ensureMusicPlayback();
      }
    });

  </script>
